x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    logging: *default-logging

  vpn:
    image: qmcgaw/gluetun:v3
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun:/dev/net/tun]
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${PROTON_WG_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${PROTON_WG_ADDRESSES:-10.2.0.2/32}
      - SERVER_COUNTRIES=${PROTON_VPN_COUNTRIES:-United States,Canada,Switzerland,Netherlands}
      - HTTPPROXY=on
      - HTTPPROXY_LISTENING_ADDRESS=:8888
      - HTTP_CONTROL_SERVER_ADDRESS=:8000
      - UPDATER_PERIOD=6h
      # UPDATER_PERIOD alone does nothing for ProtonVPN. The ticker fires, then:
      #   WARN getting protonvpn servers: credentials missing: email is empty
      #        - skipping update for protonvpn
      # so the list stays frozen at gluetun's baked-in snapshot (2025-11-18 in
      # v3.41.1 — verified 2026-08-16 by running `update -enduser -providers
      # protonvpn` against a scratch volume). Every restart logs "merging by
      # most recent 20901 hardcoded servers and 20901 servers read from
      # /gluetun/servers.json": identical counts, i.e. nothing was ever
      # refreshed. Stale peer keys are the documented cause of a tunnel that
      # looks up and passes no traffic, so this is not cosmetic.
      # Leave blank to keep today's behaviour exactly; fill in .env to fix it.
      - UPDATER_PROTONVPN_EMAIL=${PROTON_API_EMAIL:-}
      - UPDATER_PROTONVPN_PASSWORD=${PROTON_API_PASSWORD:-}
    expose: ["8888", "8000"]
    restart: unless-stopped
    labels:
      - autoheal=true
    logging: *default-logging
    networks:
      - mailnet
      # Proxy-only reach for other stacks (created once: `docker network
      # create vpnproxy`). Only this container is on it, so a consumer such as
      # discoverbcs-worker's nightly fact check gets http://vpn:8888 without
      # seeing cortex_bridge's IMAP/SMTP on mailnet.
      - vpnproxy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/v1/publicip/ip 2>/dev/null | grep -qE '\"public_ip\":\"[0-9]'"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  cortex:
    build:
      context: .
      args:
        - INSTALL_DEV=1
    restart: unless-stopped
    mem_limit: 512m
    env_file:
      - ./.env
    volumes:
      - ./local:/app/local
      - ./local/command_history:/home/app/.bash_history
      - ../eventbus/eventbus-kit:/eventbus-kit:ro
      - ../websites/kits/address-kit:/address-kit:ro
    depends_on:
      cortex_bridge:
        condition: service_healthy
    logging: *default-logging
    networks:
      - mailnet
      - eventbus
    environment:
      - PYTHONPATH=/eventbus-kit:/address-kit
      - EVENTBUS_REDIS_HOST=eventbus-redis
      - EVENTBUS_REDIS_PORT=6379
    secrets:
      - eventbus_redis_password

  cortex_bridge:
    image: ghcr.io/videocurio/proton-mail-bridge@sha256:d44f6b12650c6b0f9e0aefee192d65c6e46d0a22bd5ec189e8624812fd139c8b
    restart: unless-stopped
    mem_limit: 512m
    volumes:
      - cortex_bridge-data:/root   # persists the Bridge account/tokens
      - ./scripts/bridge-healthcheck.sh:/usr/local/bin/bridge-healthcheck.sh:ro
    expose:
      - "25"                # SMTP (internal)
      - "143"               # IMAP (internal)
    labels:
      - autoheal=true       # let autoheal restart the bridge when its healthcheck goes red
    logging: *default-logging
    networks:
      - mailnet
    environment:
      # The Bridge-local IMAP pair cortex already authenticates with, so the
      # healthcheck can attempt a real LOGIN. Interpolated from ./.env.
      - HEALTH_IMAP_USER=${BRIDGE_USERNAME:?set BRIDGE_USERNAME in cortex/.env}
      - HEALTH_IMAP_PASS=${BRIDGE_PASSWORD:?set BRIDGE_PASSWORD in cortex/.env}
    healthcheck:
      # A real IMAP LOGIN, not a bare TCP connect: Bridge keeps 1143 listening
      # even with zero users loaded, which is how the 2026-08-26 outage stayed
      # green for 42 hours. See scripts/bridge-healthcheck.sh.
      test: ["CMD", "/usr/local/bin/bridge-healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 4            # ~60s of sustained failure before autoheal restarts
      start_period: 90s     # Bridge loads the user and syncs before it can serve

networks:
  mailnet:
  eventbus:
    external: true
  vpnproxy:
    external: true

secrets:
  eventbus_redis_password:
    file: ../eventbus/secrets/eventbus_redis_password

volumes:
  cortex_bridge-data:
